<!DOCTYPE html>

<title>Формулы и специальные символы</title>

<body>

<h1>Формулы и специальные символы</h1>

<h2>Математическая формула</h2>
<p>
Формула квадратного уравнения:
ax<sup>2</sup> + bx + c = 0
</p>

<h2>Нижние индексы</h2>
<p>
Формула воды: H<sub>2</sub>O
</p>

<p>
Формула серной кислоты:
H<sub>2</sub>SO<sub>4</sub>
</p>

<h2>Специальные символы</h2>
<p>
&copy; &reg; &trade; &euro; &pound; &deg; &plusmn;
</p>

<h2>Математические символы</h2>
<p>
&times; &divide; &frac12; &frac14; &frac34;
</p>

<h2>Греческие буквы</h2>
<p>
&alpha; &beta; &gamma; &delta; &pi; &omega;
</p>

</body>
</html>
