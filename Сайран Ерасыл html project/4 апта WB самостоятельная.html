<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Учебная страница</title>

    <style>
        /* Видимый индикатор фокуса для работы с клавиатуры */
        a:focus {
            outline: 3px solid blue;
            outline-offset: 3px;
        }
    </style>
</head>

<body>

    <h1>Учебная страница</h1>

    <!-- 1. Относительная ссылка на вторую локальную страницу -->
    <h2>Локальная страница</h2>

    <p>
        <a href="second.html">
            Перейти на вторую учебную страницу
        </a>
    </p>

    <!-- 2. Ссылка на внешний образовательный ресурс -->
    <h2>Образовательный ресурс</h2>

    <p>
        <a href="https://ru.wikipedia.org/" target="_blank">
            Перейти в Википедию для поиска учебной информации
        </a>
    </p>

    <!-- 3. Изображение с alt, width, height и подписью -->
    <h2>Практическая работа</h2>

    <figure>
        <img src="laboratory.jpg"
             alt="Студенты работают за ноутбуками во время лабораторной работы"
             width="800"
             height="450">

        <figcaption>
            Практическая работа с компьютером.
        </figcaption>
    </figure>

    <!-- 4. Информация о доступности -->
    <h2>Проверка доступности</h2>

    <p>
        Для перехода между ссылками используйте клавишу Tab.
        Для открытия выбранной ссылки нажмите Enter.
    </p>

</body>

</html>
