<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Страница-конспект</title>

  <style>
    body {
      text-align: center;
    }

    section {
      text-align: left;
    }
  </style>
</head>

<body>

  <h1>Страница-конспект</h1>

  <section>
    <h2>Основные понятия</h2>
    <p>
      HTML используется для создания структуры веб-страницы.
      Заголовки помогают разделять информацию на смысловые разделы.
    </p>
  </section>

  <section>
    <h2>Пример формулы</h2>
    <p>
      Квадрат числа можно записать так:
      a<sup>2</sup>
    </p>
  </section>

  <section>
    <h2>Пример HTML-тега</h2>
    <p>
      Тег абзаца записывается как
      <code>&lt;p&gt;</code>.
    </p>
  </section>

</body>
</html>
